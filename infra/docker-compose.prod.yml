# VPS overlay (M11): only MQTT 1883 and Caddy 80/443 are published; db / redis / api / EMQX dashboard
# stay on the internal network (dashboard: ssh -L 18083:localhost:18083 is not available either, use
# `docker compose exec emqx emqx ctl ...`). Web = static build served by Caddy, which proxies /api + /socket.io.
# Exception: db is bound to the VPS loopback only, for a GUI client over an SSH tunnel
# (ssh -L 15432:127.0.0.1:5432 ...); the Lightsail firewall does not open 5432 either.
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.prod.yml --env-file infra/.env --profile app up -d
# S57: container logs capped at 3 x 10 MB each (the Docker default json-file grows without limit).

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  emqx:
    logging: *logging
    # only the cabinet port (user/pass, S43); the backend listener 1885 stays inside the Docker network
    ports: !override
      - "1883:1883"

  db:
    logging: *logging
    ports: !override
      - "127.0.0.1:5432:5432"

  redis:
    logging: *logging
    ports: !reset []

  ingest:
    logging: *logging

  command-worker:
    logging: *logging

  scheduler:
    logging: *logging

  api:
    logging: *logging
    ports: !reset []
    environment:
      COOKIE_SECURE: "true"
      # Caddy reaches the api from the compose network below
      TRUST_PROXY: 172.30.0.0/24

  notify-worker:
    logging: *logging
    environment:
      WEB_URL: https://${SITE_HOST:?set SITE_HOST in infra/.env}
      # The VPS has no IPv6 route and Sydney -> Telegram (EU) takes > 250 ms to connect: Node 22's default
      # 250 ms happy-eyeballs attempt aborts the IPv4 try and every Telegram call fails with ETIMEDOUT.
      NODE_OPTIONS: --network-family-autoselection-attempt-timeout=2000

  caddy:
    logging: *logging
    profiles: ["app"]
    image: caddy:2.8.4-alpine
    container_name: citylight-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_HOST: ${SITE_HOST:?set SITE_HOST in infra/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../web-dist:/srv/web:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api: { condition: service_started }

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  caddy-data:
  caddy-config:
