%% CityLight EMQX authorization, phase 1 (firmware unchanged: cabinets connect anonymously).
%% Rules are checked top-down; no match = deny (EMQX_AUTHORIZATION__NO_MATCH).
%%
%% Server-side clients (backend workers, debugging) connect from the host or the docker network.
%% CAUTION on the VPS: verify that EMQX sees the real public IP of cabinets (docker userland-proxy
%% rewrites the source to the bridge gateway). If not, run emqx with network_mode: host or move the
%% backend to username/password auth before going live (phase 2).
{allow, {ipaddrs, ["127.0.0.1", "172.16.0.0/12"]}, all, ["#"]}.

%% Cabinets (everyone else): uplinks only ...
{allow, all, publish, ["electrical_cabinets_default", "stm32/ec25/echo", "stm32/ec25/demo", "stm32/ec25/boot"]}.
%% ... and the shared command topic (frames are filtered by LTID on the device).
{allow, all, subscribe, ["stm32/ec25/cmd"]}.

%% Nobody outside may publish commands or read other cabinets' traffic.
{deny, all}.
