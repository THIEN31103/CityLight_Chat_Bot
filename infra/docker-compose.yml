# Local stack for M0/M1 (same files go to the VPS in M11 with docker-compose.prod.yml on top).
#   docker compose -f infra/docker-compose.yml --env-file infra/.env up -d
services:
  emqx:
    # 5.8.x = last Apache-2.0 EMQX line (5.9+ is BSL: free for one node, see docs/decisions.md).
    image: emqx/emqx:5.8.6
    container_name: citylight-emqx
    restart: unless-stopped
    ports:
      - "1883:1883"      # MQTT for cabinets: user/pass required (S43, shared device account)
      - "127.0.0.1:1885:1885"  # backend listener (no authn): published on loopback for workers run from source; not on the VPS
      - "18083:18083"    # dashboard: never expose publicly on the VPS
    environment:
      EMQX_NODE__NAME: emqx@127.0.0.1
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD_PASSWORD:?set in infra/.env}
      # S43 (2026-10-20, owner: "only 1-2 cabinets, reflash them, keep port 1883"): cabinets must log in on
      # 1883 with the shared device account (EMQX built-in database, bootstrapped from emqx/device-users.csv,
      # rendered from infra/.env by scripts/gen-emqx-acl.mjs; password changes: scripts/emqx-device-account.sh).
      # The backend moved to listener `internal` 1885 without authn, reachable only inside the Docker network
      # (and on 127.0.0.1 locally); it is still identified by its secret username in the ACL.
      EMQX_AUTHENTICATION: '[{mechanism = password_based, backend = built_in_database, user_id_type = username, password_hash_algorithm = {name = sha256, salt_position = suffix}, bootstrap_file = "/opt/emqx/etc/device-users.csv", bootstrap_type = plain}]'
      EMQX_LISTENERS__TCP__DEFAULT__ENABLE_AUTHN: "true"
      EMQX_LISTENERS__TCP__INTERNAL__BIND: "0.0.0.0:1885"
      EMQX_LISTENERS__TCP__INTERNAL__ENABLE_AUTHN: "false"
      EMQX_AUTHORIZATION__NO_MATCH: deny
      EMQX_AUTHORIZATION__DENY_ACTION: ignore
      EMQX_AUTHORIZATION__CACHE__ENABLE: "true"
      EMQX_AUTHORIZATION__SOURCES: '[{type = file, enable = true, path = "/opt/emqx/etc/acl.conf"}]'
      # S42 broker guards. Frames are < 1 KB (acks <= 512 B): 8 KB is plenty.
      EMQX_MQTT__MAX_PACKET_SIZE: 8KB
      # new connections per second (10k cabinets reconnect within ~30 s after a broker restart: ~330/s)
      EMQX_LISTENERS__TCP__DEFAULT__MAX_CONN_RATE: 500/s
      EMQX_LISTENERS__TCP__DEFAULT__MAX_CONNECTIONS: "30000"
      # a client id that connects 15 times in 1 min is banned 5 min (firmware retries every 30 s at most)
      EMQX_FLAPPING_DETECT__ENABLE: "true"
      EMQX_FLAPPING_DETECT__MAX_COUNT: "15"
      EMQX_FLAPPING_DETECT__WINDOW_TIME: 1m
      EMQX_FLAPPING_DETECT__BAN_TIME: 5m
      # Message floods are cut per LTID in the ingest worker (shared/identity.ts FrameBudget).
      # Ingest instances share the uplink topics; hashing on client id keeps one cabinet on one instance.
      EMQX_BROKER__SHARED_SUBSCRIPTION_STRATEGY: hash_clientid
    volumes:
      - ./emqx/acl.conf:/opt/emqx/etc/acl.conf:ro
      - ./emqx/device-users.csv:/opt/emqx/etc/device-users.csv:ro
      - emqx-data:/opt/emqx/data
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 10

  db:
    # TimescaleDB + PostGIS in one image, pinned by digest (PostgreSQL 16.15, TimescaleDB 2.30.2, PostGIS 3.6.4).
    image: timescale/timescaledb-ha:pg16@sha256:9c6c86701e9b9ea0d7af055338443cd66741528406fa383e5de5171d2a7a366b
    container_name: citylight-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-citylight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in infra/.env}
      POSTGRES_DB: ${POSTGRES_DB:-citylight}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - db-data:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-citylight} -d ${POSTGRES_DB:-citylight}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    container_name: citylight-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set in infra/.env}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ---- app services (profile "app"); during development they usually run on the host with tsx watch ----
  api:
    profiles: ["app"]
    build: { context: .., dockerfile: Dockerfile }
    image: citylight-server:dev
    container_name: citylight-api
    restart: unless-stopped
    # run from the package dir so tsx picks up apps/api/tsconfig.json (experimentalDecorators for NestJS)
    working_dir: /app/apps/api
    command: ["node", "--import", "tsx", "src/main.ts"]
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-citylight}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-citylight}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TOTP_ENC_KEY: ${TOTP_ENC_KEY:?set TOTP_ENC_KEY in infra/.env}
      AUTH_REQUIRE_2FA: ${AUTH_REQUIRE_2FA:-true}
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads   # incident photos: back up together with the database
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  ingest:
    profiles: ["app"]
    image: citylight-server:dev
    container_name: citylight-ingest
    restart: unless-stopped
    working_dir: /app/apps/workers
    command: ["node", "--import", "tsx", "src/ingest.ts"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-citylight}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-citylight}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      MQTT_URL: mqtt://emqx:1885
      MQTT_USERNAME: ${MQTT_BACKEND_USER}
    depends_on:
      api: { condition: service_started }
      emqx: { condition: service_healthy }

  command-worker:
    profiles: ["app"]
    image: citylight-server:dev
    container_name: citylight-command
    restart: unless-stopped
    working_dir: /app/apps/workers
    command: ["node", "--import", "tsx", "src/command-worker.ts"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-citylight}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-citylight}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      MQTT_URL: mqtt://emqx:1885
      MQTT_USERNAME: ${MQTT_BACKEND_USER}
    depends_on:
      api: { condition: service_started }
      emqx: { condition: service_healthy }

  notify-worker:
    profiles: ["app"]
    image: citylight-server:dev
    container_name: citylight-notify
    restart: unless-stopped
    working_dir: /app/apps/workers
    command: ["node", "--import", "tsx", "src/notify-worker.ts"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-citylight}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-citylight}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      # empty = no channel: alarm events are dropped (set it in infra/.env, from @BotFather)
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      WEB_URL: ${WEB_URL:-}
    depends_on:
      api: { condition: service_started }

  scheduler:
    profiles: ["app"]
    image: citylight-server:dev
    container_name: citylight-scheduler
    restart: unless-stopped
    working_dir: /app/apps/workers
    command: ["node", "--import", "tsx", "src/scheduler.ts"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-citylight}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-citylight}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      api: { condition: service_started }

volumes:
  emqx-data:
  db-data:
  redis-data:
  uploads:
