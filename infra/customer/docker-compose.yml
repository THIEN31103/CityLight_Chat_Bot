# Trial broker on the customer machine (A′, docs/trial.md): EMQX only. No code, database or server secret here.
# Cabinets connect to 1883 (device account); the CityLight server reaches the backend listener 1885 over WireGuard
# (published on the tunnel address only). Rendered with its emqx/ files by infra/scripts/trial-customer-bundle.sh.
#   docker compose up -d
name: citylight-broker

services:
  emqx:
    # 5.8.x = last Apache-2.0 EMQX line, as production (docker-compose.yml)
    image: emqx/emqx:5.8.6
    container_name: citylight-trial-emqx
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    ports:
      - "${MQTT_PORT:-1883}:1883"
      # backend listener on the WireGuard address only: needs wg0 up before Docker starts (README, step 3)
      - "${BACKEND_BIND:-10.88.0.2}:${BACKEND_PORT:-1885}:1885"
    environment:
      EMQX_NODE__NAME: emqx@127.0.0.1
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD_PASSWORD:?set in .env}
      # Accounts: the shared cabinet account + the backend account, hashed (sha256 + salt) in emqx/device-users.csv.
      # Both listeners check them; on 1885 only the CityLight server connects.
      EMQX_AUTHENTICATION: '[{mechanism = password_based, backend = built_in_database, user_id_type = username, password_hash_algorithm = {name = sha256, salt_position = suffix}, bootstrap_file = "/opt/emqx/etc/device-users.csv", bootstrap_type = hash}]'
      EMQX_LISTENERS__TCP__DEFAULT__ENABLE_AUTHN: "true"
      EMQX_LISTENERS__TCP__INTERNAL__BIND: "0.0.0.0:1885"
      EMQX_LISTENERS__TCP__INTERNAL__ENABLE_AUTHN: "true"
      EMQX_AUTHORIZATION__NO_MATCH: deny
      EMQX_AUTHORIZATION__DENY_ACTION: ignore
      EMQX_AUTHORIZATION__CACHE__ENABLE: "true"
      EMQX_AUTHORIZATION__SOURCES: '[{type = file, enable = true, path = "/opt/emqx/etc/acl.conf"}]'
      # broker guards, same values as production (S42)
      EMQX_MQTT__MAX_PACKET_SIZE: 8KB
      EMQX_LISTENERS__TCP__DEFAULT__MAX_CONN_RATE: 500/s
      EMQX_LISTENERS__TCP__DEFAULT__MAX_CONNECTIONS: "30000"
      EMQX_FLAPPING_DETECT__ENABLE: "true"
      EMQX_FLAPPING_DETECT__MAX_COUNT: "15"
      EMQX_FLAPPING_DETECT__WINDOW_TIME: 1m
      EMQX_FLAPPING_DETECT__BAN_TIME: 5m
      EMQX_BROKER__SHARED_SUBSCRIPTION_STRATEGY: hash_clientid
    volumes:
      - ./emqx/acl.conf:/opt/emqx/etc/acl.conf:ro
      - ./emqx/device-users.csv:/opt/emqx/etc/device-users.csv:ro
      - emqx-data:/opt/emqx/data
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  emqx-data:
