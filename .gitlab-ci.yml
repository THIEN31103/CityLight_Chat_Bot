# GitLab Pages: builds the M1-UI web (mock API, no backend) from branch `server` and publishes it.
# URL is shown in Deploy → Pages. The base path is taken from CI_PAGES_URL, so both
# https://<namespace>.gitlab.io/<project>/ and a "unique domain" (served at /) work.

stages:
  - deploy

pages:
  stage: deploy
  image: node:22-alpine
  rules:
    - if: $CI_COMMIT_BRANCH == "server"
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  script:
    - npm ci --cache .npm --prefer-offline --no-audit --no-fund
    - export VITE_BASE="$(node -e "const p=new URL(process.env.CI_PAGES_URL).pathname; console.log(p.endsWith('/')?p:p+'/')")"
    - echo "Building with base $VITE_BASE"
    - npm run build:web
    - rm -rf public && cp -r apps/web/dist public
    # SPA fallback: GitLab Pages serves 404.html for unknown paths, so deep links (/alarms, /incidents/…) still load the app.
    - cp public/index.html public/404.html
  artifacts:
    paths:
      - public
  environment:
    name: pages
    url: $CI_PAGES_URL
